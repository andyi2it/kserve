[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kserve-mcp"
version = "0.1.0"
description = "MCP server for managing KServe InferenceServices"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp[cli]>=1.6.0",
    "kubernetes>=23.3.0",
    "httpx>=0.27.0",
    "starlette>=0.36.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.0.0",
]

[project.scripts]
kserve-mcp = "kserve_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kserve_mcp*"]
