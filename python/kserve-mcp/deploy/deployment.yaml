---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kserve-mcp
  namespace: kserve
  labels:
    app: kserve-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kserve-mcp
  template:
    metadata:
      labels:
        app: kserve-mcp
    spec:
      serviceAccountName: kserve-mcp
      containers:
        - name: kserve-mcp
          image: kserve/kserve-mcp:latest
          ports:
            - containerPort: 8000
              name: sse
          env:
            - name: KSERVE_MCP_HOST
              value: "0.0.0.0"
            - name: KSERVE_MCP_PORT
              value: "8000"
            - name: KSERVE_MCP_READONLY
              value: "false"
            - name: KSERVE_MCP_SCRUB_LOGS
              value: "true"
            - name: KSERVE_MCP_SCRUB_INFERENCE
              value: "true"
            # Optional: comma-separated namespace block list
            # - name: KSERVE_MCP_BLOCKED_NAMESPACES
            #   value: "kube-system,kube-public,kube-node-lease"
            # Optional: restrict to specific namespaces only
            # - name: KSERVE_MCP_ALLOWED_NAMESPACES
            #   value: "kserve,production"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kserve-mcp
  namespace: kserve
  labels:
    app: kserve-mcp
spec:
  selector:
    app: kserve-mcp
  ports:
    - name: sse
      port: 8000
      targetPort: 8000
