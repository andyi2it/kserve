---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-mcp
  namespace: kserve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kserve-mcp
rules:
  # InferenceServices — full CRUD
  - apiGroups: ["serving.kserve.io"]
    resources:
      - inferenceservices
      - inferenceservices/status
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pods — read-only (for log fetching)
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Services — read-only (for resolving predictor URLs)
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  # Events — read-only (for debugging)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kserve-mcp
subjects:
  - kind: ServiceAccount
    name: kserve-mcp
    namespace: kserve
roleRef:
  kind: ClusterRole
  name: kserve-mcp
  apiGroup: rbac.authorization.k8s.io
